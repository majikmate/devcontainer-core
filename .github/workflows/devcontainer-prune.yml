# Shared workflow: list or delete the outdated versions of the image package
# and the outdated workflow runs of the calling repository
# (devenv-release prune).
#
# Used by the manual workflow prune.yml of every image repository, and by
# devcontainer-features with runs-only (it has no package, only workflow
# runs). The caller grants the permissions packages: write and actions: write.
#
# Scope "outdated": untagged versions that no kept image refers to, the tags
# buildcache-* of the former release workflow, the versions of major lines
# below major-version, the releases of the current major line older than
# max-age-days, and the finished workflow runs older than max-age-days
# (with any result: success, failure, cancelled).
# Scope "all-but-newest" (a clean-up) treats every release of the current
# major line except the newest, and every finished workflow run except the
# newest run of each workflow, as outdated. The newest release, the moving
# tags (2, 2.0, latest), the parts of kept multi-architecture images and the
# runs that are still running are never deleted.
name: "Shared: Prune package versions"

on:
  workflow_call:
    inputs:
      mode:
        description: report (list them in the run summary and the log) or apply (delete them; this cannot be undone)
        type: string
        default: report
      scope:
        description: outdated (the rules above) or all-but-newest (every release of the current major line and every workflow run except the newest)
        type: string
        default: outdated
      major-version:
        description: Current major version of the image; the versions of lower major lines are outdated (not used with runs-only)
        type: number
        default: 0
      runs-only:
        description: Only the workflow runs, no package (for a repository without an image)
        type: boolean
        default: false
      max-age-days:
        description: Releases of the current major line and finished workflow runs (any result) older than this number of days are outdated (0 keeps all)
        type: number
        default: 90

env:
  CGO_ENABLED: "0"
  # The tooling: this repository at the commit under test, otherwise its main branch
  TOOLING_REF: ${{ github.repository == 'majikmate/devcontainer-core' && github.sha || 'main' }}

jobs:
  prune:
    name: Outdated package versions
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      actions: write
    steps:
      - name: Check out the tooling
        uses: actions/checkout@v7
        with:
          repository: majikmate/devcontainer-core
          ref: ${{ env.TOOLING_REF }}
          path: .devenv
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .devenv/go.mod
          cache: false

      - name: List or delete the outdated versions and workflow runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          go -C .devenv run ./cmd/devenv-release prune
          --major "${{ inputs.major-version }}"
          --max-age-days "${{ inputs.max-age-days }}"
          --runs-max-age-days "${{ inputs.max-age-days }}"
          --all-but-newest="${{ inputs.scope == 'all-but-newest' }}"
          --runs-only="${{ inputs.runs-only }}"
          --mode "${{ inputs.mode }}"
