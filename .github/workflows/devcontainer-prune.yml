# Shared workflow: list or delete the outdated versions of the image package
# of the calling repository (devcon-release prune).
#
# Used by the manual workflow prune.yml of every image repository. Outdated
# versions (scope "outdated"): untagged versions that no kept image refers to,
# the tags buildcache-* of the former release workflow, the versions of major
# lines below major-version, and the releases of the current major line older
# than max-age-days. Scope "all-but-newest" (a one-time clean-up) treats every
# release of the current major line except the newest as outdated. The newest
# release, the moving tags (2, 2.0, latest) and the parts of kept
# multi-architecture images are never deleted.
name: "Shared: Prune package versions"

on:
  workflow_call:
    inputs:
      mode:
        description: report (list them in the run summary and the log) or apply (delete them; this cannot be undone)
        type: string
        default: report
      scope:
        description: outdated (the rules above) or all-but-newest (every release of the current major line except the newest)
        type: string
        default: outdated
      major-version:
        description: Current major version of the image; the versions of lower major lines are outdated
        type: number
        required: true
      max-age-days:
        description: Releases of the current major line older than this number of days are outdated (0 keeps all)
        type: number
        default: 90

env:
  CGO_ENABLED: "0"
  # The tooling: this repository at the commit under test, otherwise its main branch
  TOOLING_REF: ${{ github.repository == 'majikmate/devcontainer-core' && github.sha || 'main' }}

jobs:
  prune:
    name: Outdated package versions
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Check out the tooling
        uses: actions/checkout@v7
        with:
          repository: majikmate/devcontainer-core
          ref: ${{ env.TOOLING_REF }}
          path: .devcon
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .devcon/go.mod
          cache: false

      - name: List or delete the outdated versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          go -C .devcon run ./cmd/devcon-release prune
          --major "${{ inputs.major-version }}"
          --max-age-days "${{ inputs.max-age-days }}"
          --all-but-newest="${{ inputs.scope == 'all-but-newest' }}"
          --mode "${{ inputs.mode }}"
