# One-time clean-up: deletes all runs of the workflows "Dependabot Updates"
# (Dependabot is no longer used) and "Dev Environment Prebuilds" (Codespaces
# prebuilds are no longer used) in all Dev Container repositories.
#
# Manual run only. "report" lists the runs in the run summary; "apply"
# deletes them (this cannot be undone). The token of the GitHub App
# majikmate-devcontainer reaches the other repositories. Remove this workflow
# after the clean-up.
name: Dispose old workflow runs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: report (list only) or apply (delete; this cannot be undone)
        type: choice
        options: [report, apply]
        default: report

env:
  CGO_ENABLED: "0"

jobs:
  dispose:
    name: Dependabot and prebuild runs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Create a token of the GitHub App
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DEVCONTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEVCONTAINER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write

      - name: List or delete the runs
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: >-
          go run ./cmd/devcon-release dispose-runs
          --workflows "Dependabot Updates, Dev Environment Prebuilds"
          --mode "${{ inputs.mode }}"
          --repositories "majikmate/devcontainer-core majikmate/devcontainer-features
          majikmate/devcontainer-base majikmate/devcontainer-dev
          majikmate/devcontainer-classroom-web majikmate/devcontainer-classroom-web-advanced
          majikmate/devcontainer-classroom-exam-ts"
