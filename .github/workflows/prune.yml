# Manual run: lists (report) or deletes (apply) the outdated versions of
# ghcr.io/majikmate/devcontainer-core and the outdated workflow runs of this
# repository. The logic is in the shared workflow devcontainer-prune.yml of
# this repository.
#
# Scope "outdated" uses the same rules as the release workflow after every
# run (releases and workflow runs older than 90 days); "all-but-newest"
# deletes every release of the current major line except the newest and
# every workflow run except the newest run of each workflow (a clean-up).
name: Prune

on:
  workflow_dispatch:
    inputs:
      mode:
        description: report (list only) or apply (delete; this cannot be undone)
        type: choice
        options: [report, apply]
        default: report
      scope:
        description: outdated (older than 90 days, older major versions, unused) or all-but-newest
        type: choice
        options: [outdated, all-but-newest]
        default: outdated

jobs:
  prune:
    uses: ./.github/workflows/devcontainer-prune.yml
    permissions:
      packages: write
      actions: write
    with:
      mode: ${{ inputs.mode }}
      scope: ${{ inputs.scope }}
      major-version: 1
